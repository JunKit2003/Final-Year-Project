name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this main build to production
        type: boolean
        default: false

# Actions are pinned to commit SHAs (version in the comment); bump them with Dependabot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>-backend (lowercased in the job)
  IMAGE_BASE: ${{ github.repository }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: faction_test
        ports: ["3306:3306"]
        # TCP ping: MySQL's first-boot temp server only listens on the socket.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE: faction_test
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ci
      HOST_DATABASE: 127.0.0.1
      DATABASE_PORT: "3306"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: npx vitest run

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/factionbikeworks
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/factionbikeworks/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    name: Build app image${{ github.event_name != 'pull_request' && ' and push' || '' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: meta
        name: Image names
        run: |
          base="${REGISTRY}/${IMAGE_BASE,,}"
          {
            echo "backend=${base}-backend"
            echo "tag=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src
          file: src/Backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.backend) || '' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to VM
    needs: images
    # Pushes deploy automatically only after the repository opts in.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/faction' }}
      IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing deployment secret: $required"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -p ${PORT} -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Upload compose file, scripts and Nginx config
        run: |
          rsync -az -e "$SSH_CMD" docker-compose.yml deploy/deploy.sh deploy/set-admin-password.sh deploy/nginx/bikeshop.junkit.my.conf "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Pull new app image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          prefix="${REGISTRY}/${IMAGE_BASE,,}"
          # The job token can pull while the job runs; nothing is stored on the VM beyond this login.
          # deploy.sh validates tag and prefix before using them.
          printf '%s' "$GHCR_TOKEN" | $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash $DEPLOY_PATH/deploy.sh '$DEPLOY_PATH' '$prefix' '$IMAGE_TAG' '$GHCR_USER'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
