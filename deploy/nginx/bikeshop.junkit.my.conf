# Host nginx in front of the containers for bikeshop.junkit.my.
#   sudo cp deploy/nginx/bikeshop.junkit.my.conf /etc/nginx/sites-available/bikeshop.junkit.my
#   sudo ln -s /etc/nginx/sites-available/bikeshop.junkit.my /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bikeshop.junkit.my      # adds the 443 server + redirect in place
# The stack listens on 127.0.0.1:8080 (HTTP_BIND / HTTP_PORT in /opt/faction/.env).

server {
    listen 80;
    listen [::]:80;
    server_name bikeshop.junkit.my;

    # Admin product uploads send several photos per request.
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells the API the visitor used HTTPS, so the Secure session cookie (COOKIE_SECURE=true) is sent.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
